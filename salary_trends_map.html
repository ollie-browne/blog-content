    p.setAttribute("aria-label", r + ": " + fmt(DATA[r][0]) + " in 2026, " + fmt(DATA[r][1]) + " in 2027");
    p.addEventListener("click", function (e) { e.stopPropagation(); toggle(r); });
    p.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(r); }
      if (e.key === "Escape") show("Global");
    });
    p.addEventListener("pointerenter", function (e) { if (e.pointerType === "mouse") { hov = r; paint(); } });
    p.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse") { hov = null; paint(); } });
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Tab") document.body.classList.add("kbd"); });
  document.addEventListener("pointerdown", function () { document.body.classList.remove("kbd"); });
  document.getElementById("sea").addEventListener("click", function () { show("Global"); });

  function reportHeight() {
    window.parent.postMessage(Math.ceil(document.querySelector(".eca").getBoundingClientRect().height), "*");
  }
  window.addEventListener("load", reportHeight);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(reportHeight);
  if ("ResizeObserver" in window) new ResizeObserver(reportHeight).observe(document.body);
  else window.addEventListener("resize", reportHeight);
</script>
</body>
</html>
